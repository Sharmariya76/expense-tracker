name: Deploy Expense Tracker to Amazon EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Force the system to use absolute executable locations
            NODE_BIN="/usr/bin/node"
            NPM_BIN="/usr/bin/npm"
            PM2_BIN="/usr/local/bin/pm2"

            # Fallback path finding if standard location shifts
            if [ ! -f "$PM2_BIN" ]; then PM2_BIN=$(which pm2 || echo "/usr/bin/pm2"); fi
            if [ ! -f "$NPM_BIN" ]; then NPM_BIN=$(which npm || echo "/usr/local/bin/npm"); fi

            # Move to the application directory
            cd /home/ubuntu/expense-tracker

            echo "Updating files from production repository..."
            
            # Initialize project metadata if running for the first time using absolute npm path
            if [ ! -f package.json ]; then
              sudo $NPM_BIN init -y
              sudo $NPM_BIN install express
            fi

            # Install production dependencies using absolute npm path
            sudo $NPM_BIN install --production

            # Run PM2 using its absolute file location combined with sudo
            if sudo $PM2_BIN describe server > /dev/null 2>&1; then
              echo "Application process found. Performing Zero-Downtime Reload..."
              sudo $PM2_BIN reload server
            else
              echo "Starting application process on port 80..."
              sudo $PM2_BIN start server.js --name "server"
            fi
            
            # Save the PM2 state to recover on system reboots
            sudo $PM2_BIN save

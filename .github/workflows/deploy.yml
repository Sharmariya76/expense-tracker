name: Deploy Expense Tracker to Amazon EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Create the application directory if it doesn't exist
            sudo mkdir -p /home/ubuntu/expense-tracker
            sudo chown -R ubuntu:ubuntu /home/ubuntu/expense-tracker
            cd /home/ubuntu/expense-tracker

            # 2. Check and manually install Node.js if it's missing on the EC2 instance
            if ! command -v node &> /dev/null; then
              echo "Node.js not found. Manually installing Node.js LTS (v20)..."
              sudo apt-get update -y
              sudo apt-get install -y curl gnupg
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # 3. Check and manually install PM2 globally if it's missing
            if ! command -v pm2 &> /dev/null; then
              echo "PM2 not found. Manually installing PM2 globally..."
              sudo npm install pm2 -g
            fi

            # 4. Create proper system symlinks to make sure sudo can always run them
            sudo ln -sf $(which node) /usr/bin/node
            sudo ln -sf $(which npm) /usr/bin/npm
            sudo ln -sf $(which pm2) /usr/bin/pm2

            echo "Updating files from repository..."

            # 5. Initialize node project files if missing
            if [ ! -f package.json ]; then
              npm init -y
              npm install express
            fi

            # 6. Install production dependencies
            npm install --production

            # 7. Start or reload the application server on Port 80
            if sudo pm2 describe server > /dev/null 2>&1; then
              echo "Application process found. Performing Zero-Downtime Reload..."
              sudo pm2 reload server
            else
              echo "Starting application process on port 80..."
              sudo pm2 start server.js --name "server"
            fi

            # 8. Save PM2 configuration to handle system restarts
            sudo pm2 save

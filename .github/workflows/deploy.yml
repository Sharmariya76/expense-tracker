name: Deploy Expense Tracker to Amazon EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Prepare directory with full root permissions
            sudo mkdir -p /home/ubuntu/expense-tracker
            sudo chown -R ubuntu:ubuntu /home/ubuntu/expense-tracker
            cd /home/ubuntu/expense-tracker

            # 2. System updates and direct Node.js installation
            if ! [ -f /usr/bin/node ]; then
              echo "Installing Node.js..."
              sudo apt-get update -y
              sudo apt-get install -y curl gnupg
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # 3. Explicitly discover where npm is located to bypass sudo environment blocking
            NPM_PATH=$(which npm || echo "/usr/bin/npm")

            # 4. Check and install PM2 using the absolute path found for npm
            if ! [ -f /usr/bin/pm2 ] && ! [ -f /usr/local/bin/pm2 ]; then
              echo "Installing PM2 globally..."
              sudo $NPM_PATH install pm2 -g --unsafe-perm
            fi

            # 5. Build rigid, fallback-proof system links in standard execution paths
            sudo ln -sf $(which node) /usr/bin/node
            sudo ln -sf $(which npm) /usr/bin/npm
            sudo ln -sf $(which pm2) /usr/bin/pm2
            sudo ln -sf /usr/local/bin/pm2 /usr/bin/pm2 2>/dev/null || true

            echo "Setting up application structures..."

            # 6. Initialize dependencies directly through the absolute execution path
            if [ ! -f package.json ]; then
              $NPM_PATH init -y
              $NPM_PATH install express
            fi

            # 7. Localize dependencies
            $NPM_PATH install --production

            # 8. Start/Reload your live web application on port 80 using absolute path routing
            PM2_PATH=$(which pm2 || echo "/usr/bin/pm2")
            
            if sudo $PM2_PATH describe server > /dev/null 2>&1; then
              echo "Application running. Performing Hot Reload..."
              sudo $PM2_PATH reload server
            else
              echo "Launching tracker on port 80..."
              sudo $PM2_PATH start server.js --name "server"
            fi

            # 9. Commit instance to device start registers
            sudo $PM2_PATH save

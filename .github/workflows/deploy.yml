name: Deploy Static Website to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KEY }}" > key.pem
          chmod 600 key.pem
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Copy index.html to EC2
        run: |
          scp -i key.pem index.html ubuntu@${{ secrets.HOST }}:/tmp/

      - name: Deploy to Nginx
        run: |
          ssh -i key.pem ubuntu@${{ secrets.HOST }} << 'EOF'
            sudo mv /tmp/index.html /var/www/html/index.html
            sudo systemctl restart nginx
          EOF

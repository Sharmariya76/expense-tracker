name: Deploy Expense Tracker to Amazon EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. CRITICAL: Explicitly source NVM so the non-interactive shell can see node, npm, and pm2
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 2. Move directly into your application directory
            cd /home/ubuntu/expense-tracker

            echo "Syncing application code..."
            
            # 3. Handle initialization if running cleanly
            if [ ! -f package.json ]; then
              npm init -y
              npm install express
            fi

            # 4. Install project requirements 
            npm install --production

            # 5. Control PM2 lifecycle on port 3000 (which is forwarded to port 80)
            if pm2 describe server > /dev/null 2>&1; then
              echo "Application is currently live. Triggering Hot Reload..."
              pm2 reload server
            else
              echo "Launching your expense tracker application instance..."
              pm2 start server.js --name "server"
            fi

            # 6. Save configurations to ensure survival across system cycles
            pm2 save

name: Deploy Expense Tracker to Amazon EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Include standard Node.js binary environments
            export PATH=$PATH:/usr/bin:/usr/local/bin

            # Move to the application directory
            cd /home/ubuntu/expense-tracker

            echo "Updating files from production repository..."
            
            # Initialize metadata if running for the first time
            if [ ! -f package.json ]; then
              npm init -y
              npm install express
            fi

            # Install production dependencies
            npm install --production

            # Run PM2 with sudo to grant it permission to bind to Port 80
            if sudo env PATH=$PATH pm2 describe server > /dev/null 2>&1; then
              echo "Application process found. Performing Zero-Downtime Reload..."
              sudo env PATH=$PATH pm2 reload server
            else
              echo "Starting application process on port 80..."
              sudo env PATH=$PATH pm2 start server.js --name "server"
            fi
            
            # Save the PM2 state to recover on system reboots
            sudo env PATH=$PATH pm2 save
